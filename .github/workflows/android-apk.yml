name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: null-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Godot Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "cmdline-tools;latest" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Download Godot 4.7.2 and matching Android templates
        shell: bash
        env:
          GODOT_VERSION: 4.7.2-stable
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}_linux.x86_64
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -o export_templates.tpz
          mkdir -p templates_unpacked
          unzip -q export_templates.tpz -d templates_unpacked
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R templates_unpacked/templates/. "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          test -s "$TEMPLATE_DIR/android_source.zip"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_PATH"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -version
          test -x "$SDK_PATH/platform-tools/adb"

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run repository structure tests
        run: python -m pytest -q

      - name: Import project and validate resources
        run: |
          "$GODOT_BIN" --headless --editor --path . --import
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Run GDScript gameplay tests
        run: "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd

      - name: Export Android ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/NULL-debug.apk
          test -s build/NULL-debug.apk
          unzip -t build/NULL-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/NULL-debug.apk | grep -E "package: name='com.nullgame.thelivingtouch'|application-label"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Android-APK
          path: build/NULL-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: NULL Android Debug Build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: build/NULL-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
