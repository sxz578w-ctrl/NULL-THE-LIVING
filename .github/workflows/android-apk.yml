name: Android APK Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.1.0" "cmdline-tools;latest" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Download Godot 4.7.2 and matching Android templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 4 --retry-delay 2 "https://github.com/godotengine/godot/releases/download/$VERSION/Godot_v${VERSION}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 --retry-delay 2 "https://github.com/godotengine/godot/releases/download/$VERSION/Godot_v${VERSION}_export_templates.tpz" -o templates.tpz
          mkdir templates
          unzip -q templates.tpz -d templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R templates/templates/. "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          test -s "$TEMPLATE_DIR/android_source.zip"

      - name: Verify Godot and Java
        run: |
          "$GODOT_BIN" --version
          "$JAVA_HOME/bin/java" -version
