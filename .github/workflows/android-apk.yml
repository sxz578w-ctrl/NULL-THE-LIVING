name: Android APK Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Download Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 4 "https://github.com/godotengine/godot/releases/download/$VERSION/Godot_v${VERSION}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${VERSION}_linux.x86_64" >> "$GITHUB_ENV"
          curl --fail --location --retry 4 "https://github.com/godotengine/godot/releases/download/$VERSION/Godot_v${VERSION}_export_templates.tpz" -o templates.tpz
          mkdir templates
          unzip -q templates.tpz -d templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R templates/templates/. "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android paths for Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$JAVA_HOME/bin/java" -version

      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run project structure tests
        run: python -m pytest -q

      - name: Import and parse Godot project
        run: |
          "$GODOT_BIN" --headless --editor --path . --import
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Run gameplay logic tests
        run: "$GODOT_BIN" --headless --path . --script res://tests/test_runner.gd

      - name: Smoke run the main scene
        run: "$GODOT_BIN" --headless --path . --quit-after 3

      - name: Export Android ARM64 debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/NULL-debug.apk
          test -s build/NULL-debug.apk
          unzip -t build/NULL-debug.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/NULL-debug.apk | grep "com.nullgame.thelivingtouch"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NULL-Android-APK
          path: build/NULL-debug.apk
          if-no-files-found: error
          retention-days: 30
